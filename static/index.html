<body>
<canvas id="glstage" aria-hidden="true"></canvas>

<div id="topbar" class="hud">
  <div class="brand"><span class="brand-mark" aria-hidden="true">🏢</span><span class="brand-copy"><span class="brand-title">Officefloor</span><span class="brand-subtitle">agent org, live floor</span></span></div>
  <span id="mode" class="pill">…</span>
  <div id="counters" role="status" aria-live="polite" aria-atomic="true" aria-label="Fleet status"></div>
  <div class="spacer"></div>
  <button class="btn primary" id="needsBtn" aria-pressed="false" title="everything only you can unblock (n)">
    🙋 needs me <b id="needsCount">0</b>
  </button>
  <button class="btn" id="follow" aria-pressed="false" title="follow floor activity (f)">🎥 follow</button>
  <button class="btn" id="recenter" title="center the whole floor (c)">⌖ center</button>
</div>

<div id="inspector" class="hud" role="dialog" aria-label="Seat inspector">
  <button class="btn close" id="closeInspector" aria-label="Close inspector">✕</button>
  <h2 id="insName">—</h2>
  <div class="role" id="insRole"></div>
  <dl class="kv" id="insKv"></dl>
  <div class="tail" id="insTail"></div>
</div>

<div id="needs" class="hud" role="dialog" aria-label="Needs-me panel">
  <button class="btn close" id="closeNeeds" aria-label="Close needs-me panel">✕</button>
  <h3>Needs me</h3>
  <div id="needsWarn"></div>
  <ul id="needsList"></ul>
</div>

<section id="ticker" class="hud" role="region" aria-labelledby="activityHeading" data-office-hud-activity="persistent">
  <div id="activityHeader">
    <h3 id="activityHeading">Floor activity</h3>
    <button id="activityCollapseToggle" type="button" aria-controls="activityTabs feed" aria-expanded="true" aria-label="Collapse floor activity" title="Collapse floor activity">▾</button>
  </div>
  <ul id="activityCompactRow" aria-live="polite" aria-atomic="true" aria-label="Compact floor activity" hidden></ul>
  <ul id="feed" role="tabpanel" aria-live="polite" aria-atomic="false"></ul>
</section>

<details id="legend" class="hud" open>
  <summary>What you're seeing</summary>
  <div class="legend-body">
    <span>📦 branch ready</span><span>❓ needs a call</span><span>🚧 blocked</span><br />
    <span>✉️ unread directive</span><span>🧊 frozen</span><span>☠️ dark</span><span>💤 benched</span><span>❔ liveness unknown</span>
  </div>
</details>

<div id="officeTour" class="office-tour" role="dialog" aria-live="polite" aria-label="Demo state tour" hidden></div>

<div id="welcome" class="hud" role="dialog" aria-modal="true" aria-label="Welcome">
  <button class="btn close" id="closeWelcome" aria-label="Close welcome">✕</button>
  <h2>Welcome to the floor</h2>
  <p id="welcomeBody"></p>
  <button class="btn primary" id="dismissWelcome">Got it</button>
</div>

<div id="setup" class="hud" role="dialog" aria-modal="true" aria-label="Point the office at your agents">
  <h2>No agent org found</h2>
  <p id="setupBody"></p>
  <pre id="setupCommands"></pre>
  <button class="btn primary" id="setupCopy">Copy the command</button>
</div>

<div id="toast" class="hud" role="status" aria-live="polite"></div>

<!-- PARKED FOR MVP (sun-only): WXP1 DSF weather ENGINE + now-seam PRODUCERS.

     weather.js installs global
     OfficeWeatherCore (the DSF composition: makeForecast/frameAt + the 12
     leaves); office.weather.now.js reads it and installs OfficeWeatherNow —
     the schema-pinned NOW feed reserved for the post-MVP weather seam. Both register no
     OFFICE.module → side-effect markers keep OFFICE.seal() balanced. -->
<script src="weather.js" data-office-side-effect></script>
<script src="office.weather.now.js" data-office-side-effect></script>

<script src="office.ambient.visual.core.js" data-office-side-effect></script>
<!-- RBD1 AM1 interaction-log + relationshipBoard PRODUCERS. agentlog.core
     installs global OfficeAgentLog (pairKey/affinityScore/relationTier);
     office.relationship.board.js reads it and installs OfficeRelationshipBoard —
     the board the relationFloor glue below consumes. Both register no
     OFFICE.module → side-effect markers keep OFFICE.seal() balanced. -->
